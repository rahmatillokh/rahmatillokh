name: Contribution Tetris

on:
  schedule:
    # every day at 03:00 UTC (08:00 Tashkent)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate tetris SVGs
        env:
          # GH_PAT (a personal access token with the `repo` scope) also brings
          # private repositories into scope. Without it the default Actions
          # token is used, which only reaches public ones.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        # the profile repo stays in scope — the nightly bot commit is dropped by
        # author, so real README work here still counts as activity
        run: node scripts/generate-tetris.mjs "${{ github.repository_owner }}" assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tetris.svg assets/tetris-dark.svg
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh contribution tetris"
            git push
          fi
